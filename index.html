<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spørsmålsgenerator v1.9.5</title>
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('./app-v1-9-base.html?base=3',{cache:'no-store'});
    if(!response.ok) throw new Error('Kunne ikke laste grunnfilen.');
    let html=await response.text();
    html=html.replace('<title>Spørsmålsgenerator v1.8</title>','<title>Spørsmålsgenerator v1.9.5</title>');
    html=html.replace('<div class="version">v1.9</div>','<div class="version">v1.9.5</div>');

    const oldCheck=`    if(!text) return alert(sourceMode==='web' ? 'Hent eller lim inn tekst fra nettsiden først.' : 'Lim inn en fagtekst først.');\n    const type=$('questionType').value;`;
    const newCheck=`    const type=$('questionType').value;\n    if(!text && type!=='imageDrop' && type!=='drag') return alert(sourceMode==='web' ? 'Hent eller lim inn tekst fra nettsiden først.' : 'Lim inn en fagtekst først.');`;
    if(html.includes(oldCheck)) html=html.replace(oldCheck,newCheck);
    html=html.replace(`correctCount,total:q.pairs.length,prompt:q.prompt};`,`correctCount,total:q.pairs.length,prompt:q.prompt,placements};`);
    html=html.replace(`correctCount,total:q.zones.length,prompt:q.prompt};`,`correctCount,total:q.zones.length,prompt:q.prompt,placements};`);

    html=html.replace('</style>',`.response-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.response-actions .danger{background:#fee2e2;color:#991b1b;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.new-task-row{margin:0 0 16px;padding-bottom:14px;border-bottom:1px solid #e2e8f0}</style>`);

    const oldButton='<td><button class="secondary" onclick="viewResponse(${idx})">Se svar</button></td>';
    const newButton='<td><div class="response-actions"><button class="secondary" onclick="viewResponse(${idx})">Se svar</button><button class="danger" onclick="deleteResponse(${idx})">Slett</button></div></td>';
    if(html.includes(oldButton)) html=html.replace(oldButton,newButton);

    const heading='<h2>Lag en oppgave</h2>\n        <p class="muted">Lag og rediger oppgaver. Lærerdelen er beskyttet med PIN-kode.</p>';
    const headingNew='<h2>Lag en oppgave</h2>\n        <div class="new-task-row"><button type="button" class="secondary" id="newTaskBtn">Lag en ny oppgave</button></div>\n        <p class="muted">Lag og rediger oppgaver. Lærerdelen er beskyttet med PIN-kode.</p>';
    if(!html.includes(heading)) throw new Error('Fant ikke området for Lag en oppgave.');
    html=html.replace(heading,headingNew);

    const extraFns=`\nwindow.deleteResponse=(idx)=>{\n  const rs=store.responses,r=rs[idx];if(!r)return;\n  if(!confirm('Vil du slette besvarelsen fra '+r.name+' på "'+r.title+'"? Dette kan ikke angres.'))return;\n  rs.splice(idx,1);store.responses=rs;renderResponses();\n};\n\nfunction startNewTask(){\n  const hasWork=($('taskTitle').value.trim()||$('sourceText').value.trim()||$('webText').value.trim()||$('chatImport').value.trim()||!$('taskCreated').classList.contains('hidden'));\n  if(hasWork&&!confirm('Vil du starte på en ny oppgave? Oppgaver som allerede er lagret i Mine oppgavesett blir ikke slettet.'))return;\n  $('taskTitle').value='';$('sourceText').value='';$('sourceUrl').value='';$('webText').value='';$('chatImport').value='';\n  if($('fetchStatus'))$('fetchStatus').innerHTML='';if($('chatImportStatus'))$('chatImportStatus').innerHTML='';\n  $('questionType').value='both';$('questionCount').value='8';$('difficulty').value='Middels';\n  $('questionCount').disabled=false;\n  $('dragBuilder').classList.add('hidden');$('imageDropBuilder').classList.add('hidden');\n  if(typeof dragPairs!=='undefined')dragPairs=[];\n  if(typeof imageDropZones!=='undefined')imageDropZones=[];if(typeof imageDropWords!=='undefined')imageDropWords=[];if(typeof selectedImageDropWord!=='undefined')selectedImageDropWord='';\n  if($('dragPairs'))$('dragPairs').innerHTML='';\n  if($('imageDropImageData'))$('imageDropImageData').value='';if($('imageDropFile'))$('imageDropFile').value='';\n  if($('imageDropPreview'))$('imageDropPreview').removeAttribute('src');if($('imageDropStageWrap'))$('imageDropStageWrap').classList.add('hidden');\n  if($('imageDropList'))$('imageDropList').innerHTML='';if($('imageDropWordBank'))$('imageDropWordBank').innerHTML='';\n  $('taskCreated').classList.add('hidden');$('taskEmpty').classList.remove('hidden');$('taskCreated').removeAttribute('data-code');\n  $('taskCodeLabel').textContent='';$('taskSummary').textContent='';\n  $('preview').className='muted';$('preview').innerHTML='Spørsmålene vises her.';$('editorButtons').classList.add('hidden');\n  if(typeof sourceMode!=='undefined')sourceMode='text';$('sourceTextBtn').click();\n  window._editingDragCode=null;window._editingDragIndex=null;window._editingImageDropCode=null;window._editingImageDropIndex=null;\n  $('taskTitle').focus();window.scrollTo({top:0,behavior:'smooth'});\n}\n\n`;
    html=html.replace("document.addEventListener('DOMContentLoaded'",extraFns+"document.addEventListener('DOMContentLoaded'");
    html=html.replace("$('navTeacher').onclick=()=>requireTeacher('teacher');","$('navTeacher').onclick=()=>requireTeacher('teacher');\n$('newTaskBtn').onclick=startNewTask;");

    document.open();document.write(html);document.close();
  }catch(error){console.error(error);document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><h1>Spørsmålsgenerator</h1><p>Kunne ikke laste appen. Oppdater siden og prøv igjen.</p></main>';}
})();
</script>
</body>
</html>
