<!doctype html>
<html lang="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Spørsmålsgenerator v1.9.1</title>
</head>
<body>
<script>
(async()=>{
  try{
    const response=await fetch('./app-v1-9-base.html?base=1',{cache:'no-store'});
    if(!response.ok) throw new Error('Kunne ikke laste grunnfilen.');
    let html=await response.text();

    html=html.replace('<title>Spørsmålsgenerator v1.8</title>','<title>Spørsmålsgenerator v1.9.1</title>');
    html=html.replace('<div class="version">v1.9</div>','<div class="version">v1.9.1</div>');

    const oldCheck=`    if(!text) return alert(sourceMode==='web' ? 'Hent eller lim inn tekst fra nettsiden først.' : 'Lim inn en fagtekst først.');
    const type=$('questionType').value;`;
    const newCheck=`    const type=$('questionType').value;
    // Manuelt bygde oppgaver trenger ikke fagtekst. Fagtekst er bare påkrevd
    // når spørsmål faktisk skal genereres fra kildeteksten.
    if(!text && type!=='imageDrop' && type!=='drag') return alert(sourceMode==='web' ? 'Hent eller lim inn tekst fra nettsiden først.' : 'Lim inn en fagtekst først.');`;

    if(!html.includes(oldCheck)) throw new Error('Fant ikke valideringen som skulle rettes.');
    html=html.replace(oldCheck,newCheck);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.body.innerHTML='<main style="font-family:system-ui;padding:24px"><h1>Spørsmålsgenerator</h1><p>Kunne ikke laste appen. Oppdater siden og prøv igjen.</p></main>';
  }
})();
</script>
</body>
</html>
